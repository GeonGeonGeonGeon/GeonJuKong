name: iOS unsigned build
run-name: iOS unsigned build ${{ inputs.build_id }}

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: Optional identifier for locating a build
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Check Apple build tools
        run: |
          xcodebuild -version
          pod --version

      - run: npm ci
      - run: npm run check
      - run: npm test

      - name: Bundle assets and prepare iOS project
        run: npm run native:ios

      - name: Archive without signing
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/GeonJuKong.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Package archive
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/GeonJuKong.xcarchive" \
            "$RUNNER_TEMP/GeonJuKong-unsigned.xcarchive.zip"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$RUNNER_TEMP/GeonJuKong.xcarchive/Products/Applications/App.app" \
            "$RUNNER_TEMP/ipa/Payload/App.app"
          test -x "$RUNNER_TEMP/ipa/Payload/App.app/App"
          test -f "$RUNNER_TEMP/ipa/Payload/App.app/Assets.car"
          (cd "$RUNNER_TEMP/ipa" && ditto -c -k --keepParent Payload "$RUNNER_TEMP/GeonJuKong-unsigned.ipa")
          unzip -t "$RUNNER_TEMP/GeonJuKong-unsigned.ipa"
          echo 'Unsigned IPA and archive. Apple signing is required for iPhone installation.' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: GeonJuKong-ios-unsigned
          path: |
            ${{ runner.temp }}/GeonJuKong-unsigned.xcarchive.zip
            ${{ runner.temp }}/GeonJuKong-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
