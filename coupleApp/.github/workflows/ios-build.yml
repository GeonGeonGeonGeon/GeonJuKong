name: iOS unsigned build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Check Apple build tools
        run: |
          xcodebuild -version
          pod --version

      - run: npm ci
      - run: npm run check
      - run: npm test

      - name: Bundle assets and prepare iOS project
        run: npm run native:ios

      - name: Archive without signing
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/GeonJuKong.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Package archive
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/GeonJuKong.xcarchive" \
            "$RUNNER_TEMP/GeonJuKong-unsigned.xcarchive.zip"
          echo 'Unsigned archive only. Apple signing and IPA export are required for iPhone installation.' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: GeonJuKong-ios-unsigned
          path: ${{ runner.temp }}/GeonJuKong-unsigned.xcarchive.zip
          if-no-files-found: error
          retention-days: 7
